<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savings Goals | Student Budget Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <style>
        .goals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            margin: 1rem 0;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(to right, var(--accent), var(--success));
            border-radius: 5px;
            transition: width 0.5s ease;
        }
        .goal-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <i class="fas fa-wallet"></i> CampusWallet
        </div>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fas fa-chart-pie"></i> Dashboard</a></li>
            <li><a href="transactions.html"><i class="fas fa-exchange-alt"></i> Transactions</a></li>
            <li><a href="goals.html" class="active"><i class="fas fa-bullseye"></i> Savings Goals</a></li>
            <li style="margin-top: 2rem;"><a href="#" onclick="logout()" style="color: var(--danger);"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
        </ul>
    </aside>

    <!-- Mobile Overlay -->
    <div class="mobile-overlay" onclick="toggleSidebar()"></div>

    <main class="main-content">
        <header>
            <button class="mobile-menu-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <div style="flex: 1;">
                <h1>Savings Goals</h1>
                <p style="color: var(--text-muted); margin-top: 0.5rem;">Track progress for your specific targets (Laptops, Tickets).</p>
            </div>
            <div style="display:flex; gap: 0.5rem;">
                <button id="theme-toggle" class="btn" onclick="toggleTheme()" style="background:var(--glass-bg); color:var(--text-main); border: 1px solid var(--glass-border); padding: 0.5rem 1rem;">
                    <i class="fas fa-sun"></i>
                </button>
                <button class="btn btn-primary" onclick="openGoalModal()">
                    <i class="fas fa-plus"></i> New Goal
                </button>
            </div>
        </header>

        <div class="goals-grid" id="goals-container">
            <!-- Populated by JS -->
        </div>
    </main>

    <!-- Add Goal Modal -->
    <div class="modal-overlay" id="goalModal">
        <div class="glass-card modal-content">
            <div class="modal-header">
                <h2>Add Savings Goal</h2>
                <button class="close-btn" onclick="closeGoalModal()">&times;</button>
            </div>
            <form id="addGoalForm">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" class="form-control" id="goalTitle" placeholder="e.g. Hall Week Ticket" required>
                </div>
                <div class="form-group">
                    <label>Target Amount (GHS)</label>
                    <input type="number" class="form-control" id="goalTarget" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Deadline (Optional)</label>
                    <input type="date" class="form-control" id="goalDeadline">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Create Goal</button>
            </form>
        </div>
    </div>

    <!-- Update Progress Modal -->
    <div class="modal-overlay" id="progressModal">
        <div class="glass-card modal-content">
            <div class="modal-header">
                <h2>Add to Savings</h2>
                <button class="close-btn" onclick="closeProgressModal()">&times;</button>
            </div>
            <form id="updateProgressForm">
                <input type="hidden" id="progressGoalId">
                <div class="form-group">
                    <label>Amount to Add (GHS)</label>
                    <input type="number" class="form-control" id="progressAmount" step="0.01" required>
                </div>
                <button type="submit" class="btn btn-success" style="width: 100%; margin-top: 1rem; background: var(--success); color: white; border: none; padding: 0.75rem; border-radius: 8px; cursor: pointer;">Update Progress</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/goals.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => console.log('ServiceWorker registered'))
                    .catch(error => console.log('ServiceWorker registration failed: ', error));
            });
        }
    </script>
</body>
</html>
