<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CampusWallet</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { justify-content: center; align-items: center; }
        .auth-card { width: 100%; max-width: 400px; padding: 2rem; }
    </style>
</head>
<body>
    <div class="glass-card auth-card">
        <h1 style="text-align: center; margin-bottom: 2rem;">
            <i class="fas fa-wallet" style="color: var(--accent);"></i> CampusWallet
        </h1>
        <form id="registerForm">
            <div class="form-group">
                <label>Choose a Username</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <div class="form-group">
                <label>Choose a Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Create Account</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
            Already have an account? <a href="login.html" style="color: var(--accent); text-decoration: none;">Log in here</a>
        </p>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const payload = {
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                };
                await fetchAPI('/register', 'POST', payload);
                alert('Registration successful! Please log in.');
                window.location.href = 'login.html';
            } catch (error) {} 
        });
    </script>
</body>
</html>
