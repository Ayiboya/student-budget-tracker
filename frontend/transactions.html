<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions | Student Budget Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <i class="fas fa-wallet"></i> CampusWallet
        </div>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fas fa-chart-pie"></i> Dashboard</a></li>
            <li><a href="transactions.html" class="active"><i class="fas fa-exchange-alt"></i> Transactions</a></li>
            <li><a href="goals.html"><i class="fas fa-bullseye"></i> Savings Goals</a></li>
            <li style="margin-top: 2rem;"><a href="#" onclick="logout()" style="color: var(--danger);"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
        </ul>
    </aside>

    <!-- Mobile Overlay -->
    <div class="mobile-overlay" onclick="toggleSidebar()"></div>

    <main class="main-content">
        <header>
            <button class="mobile-menu-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <div style="flex: 1;">
                <h1>Transactions</h1>
                <p style="color: var(--text-muted); margin-top: 0.5rem;">Manage all your income and expenses.</p>
            </div>
            <div style="display:flex; gap: 0.5rem;">
                <button id="theme-toggle" class="btn" onclick="toggleTheme()" style="background:var(--glass-bg); color:var(--text-main); border: 1px solid var(--glass-border); padding: 0.5rem 1rem;">
                    <i class="fas fa-sun"></i>
                </button>
                <button class="btn" onclick="exportToPDF()" style="background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid var(--glass-border); padding: 0.5rem 1rem;">
                    <i class="fas fa-file-pdf"></i> Export
                </button>
                <button class="btn btn-primary" onclick="openTransactionModal()">
                    <i class="fas fa-plus"></i> New
                </button>
            </div>
        </header>

        <div class="glass-card">
            <div class="table-container">
                <table id="all-transactions-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Type</th>
                            <th>Amount</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Add Transaction Modal -->
    <div class="modal-overlay" id="transactionModal">
        <div class="glass-card modal-content">
            <div class="modal-header">
                <h2>Add Transaction</h2>
                <button class="close-btn" onclick="closeTransactionModal()">&times;</button>
            </div>
            <form id="addTransactionForm">
                <div class="form-group">
                    <label>Type</label>
                    <select class="form-control" id="transType" required>
                        <option value="expense">Expense</option>
                        <option value="income">Income</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Amount (GHS)</label>
                    <input type="number" class="form-control" id="transAmount" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select class="form-control" id="transCategory" required>
                        <option value="Food">Food / Night Market</option>
                        <option value="Transport">Transport / Shuttles</option>
                        <option value="Academics">Handouts / Academics</option>
                        <option value="Housing">Hostel Rent / Bills</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Allowance">Allowance</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" class="form-control" id="transDesc" placeholder="e.g. Bought waakye">
                </div>
                <div class="form-group">
                    <label>Date (Optional)</label>
                    <input type="date" class="form-control" id="transDate">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Save Transaction</button>
            </form>
        </div>
    </div>

    <!-- html2pdf library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/transactions.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => console.log('ServiceWorker registered'))
                    .catch(error => console.log('ServiceWorker registration failed: ', error));
            });
        }
    </script>
</body>
</html>
